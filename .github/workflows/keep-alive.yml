name: Keep Render awake

# Render's free plan spins a web service down after 15 minutes without
# inbound traffic. GitHub's minimum cron interval is 5 minutes, and runs
# can be delayed under load, so each run waits a random 0-4 minutes before
# pinging /health. Consecutive pings then land roughly 1-9 minutes apart
# (5 min minus max jitter to 5 min plus max jitter), well inside the
# 15-minute idle window, and never on a fixed schedule.
#
# This is a single inbound GET to the cheap /health route, which is normal
# monitoring traffic for Render. The documented free-plan suspension risks
# are outbound bandwidth and instance-hour overages, not inbound pings.

# Schedule disabled — re-enable by uncommenting the schedule block.
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /health after a random delay
        env:
          RENDER_URL: https://vega-stremio-addon-qtjz.onrender.com
        run: |
          set -euo pipefail
          delay=$(( RANDOM % 240 ))
          echo "Sleeping ${delay}s before ping"
          sleep "$delay"
          curl -fsS --max-time 90 --retry 2 --retry-delay 15 \
            -o /dev/null -w "health: %{http_code} in %{time_total}s\n" \
            "$RENDER_URL/health"
