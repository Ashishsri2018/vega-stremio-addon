name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vega-stremio-addon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-beamup:
    name: Deploy to Beamup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, docker]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: beamup
      url: https://a38b6dd4fcd1-vega-stremio-addon-docker.baby-beamup.club/manifest.json
    concurrency:
      group: deploy-beamup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure SSH
        env:
          BEAMUP_SSH_PRIVATE_KEY: ${{ secrets.BEAMUP_SSH_PRIVATE_KEY }}
          BEAMUP_KNOWN_HOSTS: ${{ secrets.BEAMUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${BEAMUP_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::BEAMUP_SSH_PRIVATE_KEY repository secret is not set"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$BEAMUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/beamup"
          chmod 600 "$HOME/.ssh/beamup"
          if [ -n "${BEAMUP_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$BEAMUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H a.baby-beamup.club > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Push to Beamup
        env:
          BEAMUP_REMOTE: ${{ secrets.BEAMUP_REMOTE }}
        run: |
          set -uo pipefail
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/beamup -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          remote="${BEAMUP_REMOTE:-dokku@a.baby-beamup.club:a38b6dd4fcd1/vega-stremio-addon-docker}"
          set +e
          output=$(git push "$remote" HEAD:master --force 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # Beamup currently deploys successfully, then rejects the ref because its
            # beamup-sync-swarm hook cannot parse an empty registry response.
            if printf '%s' "$output" | grep -q "Deploying web" &&
               printf '%s' "$output" | grep -q "beamup-sync-swarm" &&
               printf '%s' "$output" | grep -q "Unexpected end of JSON input"; then
              echo "::warning::Beamup deployed the app but its sync hook failed; treating the deployment as successful"
            else
              exit "$status"
            fi
          fi
