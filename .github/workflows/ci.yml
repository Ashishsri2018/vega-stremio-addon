name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: vega-stremio-addon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container startup
        run: |
          set -euo pipefail
          docker run -d --name addon-smoke \
            -e VEGA_ENV_FILE=/dev/null \
            -e UPDATE_ON_START=false \
            -e LOG_LEVEL=debug \
            -p 7000:7000 \
            vega-stremio-addon:ci
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:7000/health | grep -q '"status"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::addon did not answer /health within 45s"
            docker logs addon-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:7000/manifest.json | grep -q '"id"'
          echo "container answered /health and /manifest.json"
      - name: Container logs
        if: always()
        run: |
          docker logs addon-smoke || true
          docker rm -f addon-smoke || true

  deploy-beamup:
    name: Deploy to Beamup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, docker]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: beamup
    concurrency:
      group: deploy-beamup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure SSH
        env:
          BEAMUP_SSH_PRIVATE_KEY: ${{ secrets.BEAMUP_SSH_PRIVATE_KEY }}
          BEAMUP_KNOWN_HOSTS: ${{ secrets.BEAMUP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${BEAMUP_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::BEAMUP_SSH_PRIVATE_KEY repository secret is not set"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$BEAMUP_SSH_PRIVATE_KEY" > "$HOME/.ssh/beamup"
          chmod 600 "$HOME/.ssh/beamup"
          if [ -n "${BEAMUP_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$BEAMUP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H a.baby-beamup.club > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Push to Beamup
        env:
          BEAMUP_REMOTE: ${{ secrets.BEAMUP_REMOTE }}
        run: |
          set -uo pipefail
          if [ -z "${BEAMUP_REMOTE:-}" ]; then
            echo "::error::BEAMUP_REMOTE repository secret is not set"
            exit 1
          fi
          remote="$BEAMUP_REMOTE"
          app="${remote#*:}"
          name="${app##*/}"
          echo "::add-mask::$remote"
          echo "::add-mask::$app"
          echo "::add-mask::$name"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/beamup -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          set +e
          output=$(git push "$remote" HEAD:master --force 2>&1)
          status=$?
          set -e
          sanitized="$output"
          sanitized="${sanitized//$remote/<beamup-remote>}"
          sanitized="${sanitized//$app/<beamup-app>}"
          sanitized="${sanitized//$name/<beamup-app>}"
          printf '%s\n' "$sanitized"
          if [ "$status" -ne 0 ]; then
            # Beamup currently deploys successfully, then rejects the ref because its
            # beamup-sync-swarm hook cannot parse an empty registry response.
            if printf '%s' "$output" | grep -q "Deploying web" &&
               printf '%s' "$output" | grep -q "beamup-sync-swarm" &&
               printf '%s' "$output" | grep -q "Unexpected end of JSON input"; then
              echo "::warning::Beamup deployed the app but its sync hook failed; treating the deployment as successful"
            else
              exit "$status"
            fi
          fi
      - name: Apply Beamup secrets
        env:
          BEAMUP_REMOTE: ${{ secrets.BEAMUP_REMOTE }}
          BEAMUP_EXTRA_ENV: ${{ secrets.BEAMUP_EXTRA_ENV }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${TMDB_API_KEY:-}" ]; then
            BEAMUP_EXTRA_ENV="${BEAMUP_EXTRA_ENV:+$BEAMUP_EXTRA_ENV$'\n'}TMDB_API_KEY=$TMDB_API_KEY"
            export BEAMUP_EXTRA_ENV
          fi
          ./scripts/apply-beamup-env.sh
